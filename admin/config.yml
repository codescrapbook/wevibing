local_backend: true

backend:
  name: github
  repo: codescrapbook/wevibing
  branch: main
  # For production GitHub OAuth, set up a proxy and uncomment:
  # base_url: https://YOUR-OAUTH-APP

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

site_url: "https://wevibing.com"
display_url: "https://wevibing.com"

collections:
  - name: "posts"
    label: "Posts"
    description: "Blog posts, listed on /blog/."
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", default: "", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "schedule"
    label: "Stream schedule"
    files:
      - label: "Twitch schedule"
        name: "schedule"
        file: "_data/schedule.yml"
        description: "Times are America/Chicago (CT). Use Day for a weekly slot or Date for a one-off."
        fields:
          - label: "Slots"
            name: "slots"
            widget: "list"
            summary: "{{fields.title}} ({{fields.day}}{{fields.date}} {{fields.start}})"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Weekly day", name: "day", widget: "select", required: false, options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] }
              - { label: "One-off date", name: "date", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Start (24h HH:MM, CT)", name: "start", widget: "string", pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "Use 24-hour HH:MM, e.g. 19:00"] }
              - { label: "Duration (minutes)", name: "duration_minutes", widget: "number", value_type: "int", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Example entry", name: "example", widget: "boolean", required: false, default: false }
  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Projects"
        name: "projects"
        file: "projects.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Support"
        name: "support"
        file: "support.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

