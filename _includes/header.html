<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo" />
      <span class="brand-text">{{ site.title }}</span>
    </a>
    <nav class="nav">
      <ul>
        {% for item in site.nav %}
          <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.name }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <a class="cta" href="https://www.patreon.com/wevibing" target="_blank" rel="noopener">Support</a>
  </div>
</header>
