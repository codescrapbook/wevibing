<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/logo.png' | relative_url }}" alt="{{ site.title }}" width="371" height="382" />
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Toggle menu">
      <span class="nav-toggle-box" aria-hidden="true">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </span>
      <span class="nav-toggle-text">Menu</span>
    </button>
    <nav class="site-nav" id="site-menu">
      <ul>
        {% for item in site.navigation %}
          <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
        <li class="cta">
          <a href="https://www.patreon.com/wevibing" target="_blank" rel="noopener">Support</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
