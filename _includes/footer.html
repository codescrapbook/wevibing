<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-left">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} · Built with Jekyll</p>
      <p>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
        <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a> ·
        <a href="{{ '/robots.txt' | relative_url }}">Robots</a> ·
        <a href="{{ '/support/' | relative_url }}">Support</a>
      </p>
      <p class="footer-legal">
        <a href="{{ site.legal.privacy_url }}">Privacy Policy</a> ·
        <a href="{{ site.legal.terms_url }}">Terms of Service</a> ·
        <a href="{{ site.legal.cookies_url }}">Cookie Notice</a> ·
        <button type="button" class="link-button" data-cookie-preferences>Cookie Preferences</button>
      </p>
    </div>
    <div class="footer-right">
      <p>Created by {{ site.author.name }}</p>
      <p class="small">Uprightly · VitalPerks</p>
    </div>
  </div>
</footer>
