<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-left">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} · Built with Jekyll</p>
      <p>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
        <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a> ·
        <a href="{{ '/robots.txt' | relative_url }}">Robots</a>
      </p>
    </div>
    <div class="footer-right">
      <p>Created by {{ site.author.name }}</p>
      <p class="small">Uprightly · VitalPerks</p>
    </div>
  </div>
</footer>
