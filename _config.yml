title: "We Vibing"
tagline: "Code with AI — vibe first, then agents and guardrails"
description: "We Vibing teaches coding with AI: start with vibe coding, then agentic programming, guardrails, and beyond."
url: "https://wevibing.com" # canonical domain
baseurl: "" # custom domain serves the site at the root of wevibing.com

# Flip to false and redeploy to publish the full site.
coming_soon: true
lang: en
timezone: UTC

# Email notifications are handled by Relay (relay.whatdoyouwant.io), double opt-in.
# The form posts here; the pk_live_ value is a public site key and is safe in the page.
# Relay 303-redirects no-JS posts to /check-your-inbox/ or /subscribe-error/.
subscribe:
  endpoint: "https://relay.whatdoyouwant.io/f/pk_live_wevibing_8fa4114f5dcfc996a5b88ea5/subscribe"
  # Cloudflare Turnstile TEST key (always passes). Swap for the real site key before launch.
  turnstile_sitekey: "1x0000000000000000000000000000000AA"

twitch:
  channel: "wevibing"
  url: "https://www.twitch.tv/wevibing"
  schedule_url: "https://www.twitch.tv/wevibing/schedule"

author:
  name: "Joe Seeley"

permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate-v2

# Pagination (jekyll-paginate-v2)
pagination:
  enabled: true

exclude:
  - node_modules
  - vendor
  - script
  - .devcontainer
  - README.md
  - Gemfile.lock

sass:
  style: compressed
  sass_dir: assets/css

feed:
  path: feed.xml

seo:
  type: "Website"

navigation:
  - title: "Home"
    url: "/"
  - title: "Schedule"
    url: "/schedule/"
  - title: "Blog"
    url: "/blog/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"
