---
layout: default
---
<article class="page">
  {% unless page.hide_title %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {% endunless %}
  <section class="page-body">
    {{ content }}
  </section>
</article>
